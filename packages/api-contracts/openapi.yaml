                $ref: "#/components/schemas/Error"
        "410":
          description: SYNC_CURSOR_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/{conversationId}/receipts:
    put:
      summary: Cập nhật deliveredSeq/readSeq (chỉ tăng)
      security:
        - bearer: []
      x-auth: token
      x-rate-limit: user 120/phút
      x-idempotency: natural
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHENTICATED / TOKEN_EXPIRED / TOKEN_REUSED / INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND (gộp: không tồn tại hoặc không có quyền)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sync:
    get:
      summary: Delta user_changes; không cursor = lần đầu
      security:
        - bearer: []
      x-auth: token
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
            pattern: ^[A-Za-z0-9_-]+$
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPage"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHENTICATED / TOKEN_EXPIRED / TOKEN_REUSED / INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: SYNC_CURSOR_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/reports:
    post:
      summary: ⚖ Báo cáo người/tin; lưu bản chụp
      security:
        - bearer: []
      x-auth: token
      x-rate-limit: user 20/ngày
      x-idempotency: Idempotency-Key
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAccepted"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHENTICATED / TOKEN_EXPIRED / TOKEN_REUSED / INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND (gộp: không tồn tại hoặc không có quyền)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/health/live:
    get:
      summary: Tiến trình sống
      security: []
      x-auth: public
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /v1/health/ready:
    get:
      summary: DB kết nối được + migration đúng phiên bản
      security: []
      x-auth: public
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "503":
          description: SERVER_BUSY (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Seq:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: ^[a-z0-9_][a-z0-9_.]{1,28}[a-z0-9_]$
    Password:
      type: string
      minLength: 8
      maxLength: 128
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REUSED
        - INVALID_CREDENTIALS
        - OTP_REQUIRED
        - OTP_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - USERNAME_TAKEN
        - IDEMPOTENCY_CONFLICT
        - VERSION_CONFLICT
        - RECALL_WINDOW_EXPIRED
        - GROUP_NOT_SUPPORTED
        - DEVICE_LIMIT_REACHED
        - SYNC_CURSOR_EXPIRED
        - RATE_LIMITED
        - SERVER_BUSY
        - INTERNAL
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Accepted:
      type: object
      properties:
        status:
          type: string
          enum:
            - accepted
      required:
        - status
      additionalProperties: false
    Ok:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        username:
          $ref: "#/components/schemas/Username"
        email:
          type: string
          maxLength: 320
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          $ref: "#/components/schemas/Password"
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - username
        - email
        - password
        - deviceName
      additionalProperties: false
    RegisterResponse:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - registrationId
      additionalProperties: false
    VerifyEmailRequest:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - registrationId
        - code
      additionalProperties: false
    ResendOtpRequest:
      oneOf:
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - register
            registrationId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required:
            - purpose
            - registrationId
          additionalProperties: false
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - device
            challengeId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required:
            - purpose
            - challengeId
          additionalProperties: false
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 320
        password:
          $ref: "#/components/schemas/Password"
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        deviceToken:
          type: string
          minLength: 32
          maxLength: 512
      required:
        - identifier
        - password
        - deviceName
      additionalProperties: false
    TokenPair:
      type: object
      properties:
        scope:
          type: string
          enum:
            - full
            - restore
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512
        refreshExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        deviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        deviceToken:
          type: string
          minLength: 32
          maxLength: 512
      required:
        - scope
        - accessToken
        - accessExpiresAt
        - refreshToken
        - refreshExpiresAt
        - deviceId
      additionalProperties: false
    OtpChallenge:
      type: object
      properties:
        challenge:
          type: string
          enum:
            - device_otp
        challengeId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        expiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - challenge
        - challengeId
        - expiresAt
      additionalProperties: false
    LoginResponse:
      anyOf:
        - $ref: "#/components/schemas/TokenPair"
        - $ref: "#/components/schemas/OtpChallenge"
    VerifyDeviceRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - challengeId
        - code
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512
      required:
        - refreshToken
      additionalProperties: false
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        code:
          type: string
          pattern: ^[0-9]{6}$
        newPassword:
          $ref: "#/components/schemas/Password"
      required:
        - email
        - code
        - newPassword
      additionalProperties: false
    RecoverRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 320
        recoveryCode:
          type: string
          minLength: 8
          maxLength: 64
        newPassword:
          $ref: "#/components/schemas/Password"
      required:
        - identifier
        - recoveryCode
        - newPassword
      additionalProperties: false
    Privacy:
      type: object
      properties:
        discoverable:
          type: string
          enum:
            - everyone
            - nobody
        readReceipts:
          type: boolean
        hideOnline:
          type: boolean
      required:
        - discoverable
        - readReceipts
        - hideOnline
      additionalProperties: false
    Settings:
      type: object
      properties:
        newDeviceOtp:
          type: boolean
        locale:
          type: string
          enum:
            - vi
            - en
        notificationsEnabled:
          type: boolean
        privacy:
          $ref: "#/components/schemas/Privacy"
        version:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
      required:
        - newDeviceOtp
        - locale
        - notificationsEnabled
        - privacy
        - version
      additionalProperties: false
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          nullable: true
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          maxLength: 320
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        status:
          type: string
          enum:
            - active
            - deleting
        deletionDueAt:
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        profileVersion:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        settings:
          $ref: "#/components/schemas/Settings"
      required:
        - id
        - username
        - displayName
        - email
        - status
        - deletionDueAt
        - profileVersion
        - settings
      additionalProperties: false
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          nullable: true
          type: string
          minLength: 1
          maxLength: 80
        expectedVersion:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
      required:
        - displayName
        - expectedVersion
      additionalProperties: false
    UpdateSettingsRequest:
      type: object
      properties:
        newDeviceOtp:
          type: boolean
        locale:
          type: string
          enum:
            - vi
            - en
        notificationsEnabled:
          type: boolean
        privacy:
          type: object
          properties:
            discoverable:
              type: string
              enum:
                - everyone
                - nobody
            readReceipts:
              type: boolean
            hideOnline:
              type: boolean
          additionalProperties: false
        expectedVersion:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        currentPassword:
          allOf:
            - $ref: "#/components/schemas/Password"
      required:
        - expectedVersion
      additionalProperties: false
    ChangeEmailRequest:
      type: object
      properties:
        newEmail:
          type: string
          maxLength: 320
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          $ref: "#/components/schemas/Password"
      required:
        - newEmail
        - password
      additionalProperties: false
    ConfirmEmailRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - code
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          $ref: "#/components/schemas/Password"
        newPassword:
          $ref: "#/components/schemas/Password"
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    PasswordConfirm:
      type: object
      properties:
        password:
          $ref: "#/components/schemas/Password"
      required:
        - password
      additionalProperties: false
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        current:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - name
        - current
        - lastSeenAt
        - createdAt
      additionalProperties: false
    JobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          type: string
          enum:
            - queued
            - running
            - done
            - failed
      required:
        - jobId
        - status
      additionalProperties: false
    RecoveryCodes:
      type: object
      properties:
        codes:
          minItems: 10
          maxItems: 10
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - codes
        - createdAt
      additionalProperties: false
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          nullable: true
          type: string
          minLength: 1
          maxLength: 80
      required:
        - id
        - username
        - displayName
      additionalProperties: false
    UserLookup:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/PublicUser"
    FriendRequest:
      type: object
      properties:
        id:
