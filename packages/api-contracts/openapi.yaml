        "422":
          description: OTP_INVALID / RECALL_WINDOW_EXPIRED / GROUP_NOT_SUPPORTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
