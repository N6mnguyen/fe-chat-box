openapi: 3.0.3
info:
  title: vchat API
  version: 1.0.0
  description: Sinh từ @vchat/api-contracts. Không sửa tay.
servers:
  - url: http://localhost:3000
paths:
  /v1/auth/register:
    post:
      summary: Đăng ký; luôn 202 cùng hình dạng
      security: []
      x-auth: public
      x-rate-limit: IP 5/giờ, 20/ngày
      x-idempotency: natural
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: USERNAME_TAKEN / IDEMPOTENCY_CONFLICT / VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: SERVER_BUSY (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/verify-email:
    post:
      summary: Xác minh OTP đăng ký, cấp token
      security: []
      x-auth: public
      x-rate-limit: 5 lần sai/mã; IP 30/giờ
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: OTP_INVALID / RECALL_WINDOW_EXPIRED / GROUP_NOT_SUPPORTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/resend-otp:
    post:
      summary: Gửi lại OTP; luôn 202
      security: []
      x-auth: public
      x-rate-limit: email 5/giờ, 10/ngày, cách ≥60s; IP 20/ngày; thiết bị 10/ngày;
        trần toàn hệ thống/ngày
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login:
    post:
      summary: Đăng nhập; 200 TokenPair (scope full, hoặc restore nếu deleting) hoặc
        OtpChallenge
      security: []
      x-auth: public
      x-rate-limit: IP 20/phút & 200/giờ; identifier 10 lần sai/15 phút -> khóa tạm
        1→5→15→60 phút; IP+identifier 5 sai/15 phút
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHENTICATED / TOKEN_EXPIRED / TOKEN_REUSED / INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN (gộp: không phải bạn, bị chặn, sai mật khẩu xác nhận)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: SERVER_BUSY (+Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login/verify-device:
