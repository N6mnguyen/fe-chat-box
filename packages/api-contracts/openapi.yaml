  /v1/auth/recover:
    post:
      summary: Khôi phục bằng mã khôi phục (sau MVP đợt đầu)
      security: []
      x-auth: public
      x-rate-limit: IP 20/phút & 200/giờ; identifier 10 lần sai/15 phút -> khóa tạm
